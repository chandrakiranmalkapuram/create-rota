name: CI

on:
  push:
    branches: [main, master, premium-v1]
  pull_request:
    branches: [main, master, premium-v1]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          cd apps/api
          ruff check .

      - name: Run Pytest
        run: |
          cd apps/api
          pytest

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run Vitest
        run: |
          cd apps/web
          npm run test:run

      - name: Build Web Application
        run: |
          cd apps/web
          npm run build
