services:
  postgres:
    image: postgres:16-alpine
    container_name: create_rota_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: create_rota
      POSTGRES_PASSWORD: create_rota_dev_pw
      POSTGRES_DB: create_rota_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U create_rota -d create_rota_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: create_rota_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
